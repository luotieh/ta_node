node:
  device_id: "node-001"
  management_url: "http://127.0.0.1:8080/api/events"
  token: ""

capture:
  interface: "eth0"
  pcap_file: ""
  bpf_filter: ""
  snaplen: 1600
  promiscuous: true

patterns:
  pattern_dir: "./patterns"

intel:
  intel_file: "./configs/intel.yaml"
  reload_interval_sec: 30
  enable_hot_reload: true
  prune_expired_interval_sec: 300
  accept_stix: true
  default_source: "Threat Intel Hub"
  max_items: 100000

evidence:
  enable_pcap_save: true
  pcap_dir: "./data/evidence"

event:
  enable_push: true
  queue_db: "./data/event_queue.db"
  push_batch_size: 100
  retry_interval_sec: 30
  push_timeout_sec: 5

flow:
  max_flows: 1000000
  idle_timeout_sec: 120
  cleanup_interval_sec: 30

server:
  enable: true
  # Bind to localhost by default; the config page and write APIs are otherwise
  # exposed without auth. Set a token and/or front with a TLS reverse proxy
  # before binding to 0.0.0.0.
  listen: "127.0.0.1:19090"
  token: ""
