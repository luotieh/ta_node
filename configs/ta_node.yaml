node:
  device_id: "node-001"
  # Management event-ingest endpoint. For the warning-platform backend, use the
  # node ingest path (NOT /api/events*, which is the agent event-create API and
  # rejects node events with 400 "事件消息不能为空"):
  #   http://<host>:<port>/traffic/internal/event/push
  management_url: "http://127.0.0.1:8080/traffic/internal/event/push"
  # Sent as the X-API-Key header on push. Set only if the management configures
  # internal_api_key; leave empty when the ingest endpoint is open.
  api_key: ""
  # Local network ranges (CIDR) used to classify event direction as
  # inbound/outbound/lateral. Leave empty to report direction as "unknown".
  home_net: []
    # - "10.0.0.0/8"
    # - "192.168.0.0/16"

capture:
  interface: "eth0"
  pcap_file: ""
  bpf_filter: ""
  snaplen: 1600
  promiscuous: true

patterns:
  # 指纹（payload 正则）检测开关。false 时不加载 pattern_dir，节点只推送
  # intel IOC 命中产生的事件。
  enable: false
  pattern_dir: "./patterns"

intel:
  # Primary writable file: API / CLI / Hub-sync changes are persisted here.
  intel_file: "./configs/intel.yaml"
  reload_interval_sec: 30
  enable_hot_reload: true
  prune_expired_interval_sec: 300
  accept_stix: true
  default_source: "Threat Intel Hub"
  max_items: 100000
  # 每日定时从下述目录增量同步 IOC 规则到 intel_file(主文件即唯一规则来源)。
  ioc_sync_dir: "/data/yt"        # 网闸投递的规则目录（主）
  ioc_sync_dir2: "/data/ftp"      # 网闸投递的规则目录（备）
  enable_ioc_sync: true
  ioc_sync_interval_min: 60       # 每隔多少分钟取一次新规则（启动时先跑一次）
  ioc_sync_retain_days: 10        # 删除该目录内早于 N 天的 zip
  # 无每日条数上限：一次导入所有新规则，推送量由威胁聚合平台侧控制。

evidence:
  enable_pcap_save: true
  pcap_dir: "./data/evidence"
  retain_days: 7            # PCAP 保留天数，超期自动删除；0=不清理
  hash_evidence_dir: true   # 按事件 ID 前 2 位 hex 哈希分桶（256 子目录）
  archive_monthly: true     # 每月将上月目录压缩为 zip 归档

event:
  enable_push: true
  queue_db: "./data/event_queue.db"
  push_batch_size: 100
  retry_interval_sec: 30
  push_timeout_sec: 5
  # 单个事件推送失败的最大重试次数，超过后放弃（仍保留在队列中可查，
  # 但不再重推），避免管理平台长期不可达时积压事件无限重放。0 表示不限。
  max_push_retry: 20
  # Sliding window (seconds) for the node-local burst counter stamped on events
  # as local_hit_count/local_window_sec (node-scoped hint, not a global count).
  # Set 0 to disable.
  local_hit_window_sec: 60

flow:
  max_flows: 1000000
  idle_timeout_sec: 120
  cleanup_interval_sec: 30

aggregation:
  mode: "session"
  enable_transaction_link: true
  response_wait_sec: 30
  # Throttle non-final context revision pushes for long-lived flows
  revision_interval_sec: 10
  max_sessions: 100000
  max_transactions_per_session: 16
  max_packets_per_transaction: 128
  max_reassembly_bytes_per_side: 262144
  max_out_of_order_bytes: 65536
  store_packet_index: true
  save_full_session_pcap: false

server:
  enable: true
  # Bind to localhost by default; the config page and write APIs are otherwise
  # exposed without auth. Set a token and/or front with a TLS reverse proxy
  # before binding to 0.0.0.0.
  listen: "127.0.0.1:19090"
  token: ""

# Lossless internal storage. All event revisions and public JSON remain intact.
storage:
  backend: "v2"                    # legacy remains available for compatibility
  archive_dir: ""                  # configure a capacity-provisioned archive volume
  archive_after_hours: 24           # acknowledged records only; archive retains history
  maintenance_interval_sec: 60
  archive_batch_size: 100
  high_water_bytes: 0               # provision from actual disk capacity; 0 disables
  low_water_bytes: 0
  min_free_bytes: 0                 # capacity warning threshold; never silently drops events
