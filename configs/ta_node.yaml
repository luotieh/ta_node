node:
  device_id: "node-001"
  # Management event-ingest endpoint. For the warning-platform backend, use the
  # node ingest path (NOT /api/events*, which is the agent event-create API and
  # rejects node events with 400 "事件消息不能为空"):
  #   http://<host>:<port>/traffic/internal/event/push
  management_url: "http://127.0.0.1:8080/traffic/internal/event/push"
  # Sent as the X-API-Key header on push. Set only if the management configures
  # internal_api_key; leave empty when the ingest endpoint is open.
  api_key: ""
  # Local network ranges (CIDR) used to classify event direction as
  # inbound/outbound/lateral. Leave empty to report direction as "unknown".
  home_net: []
    # - "10.0.0.0/8"
    # - "192.168.0.0/16"

capture:
  interface: "eth0"
  pcap_file: ""
  bpf_filter: ""
  snaplen: 1600
  promiscuous: true

patterns:
  # 指纹（payload 正则）检测开关。false 时不加载 pattern_dir，节点只推送
  # intel IOC 命中产生的事件。
  enable: false
  pattern_dir: "./patterns"

intel:
  # Primary writable file: API / CLI / Hub-sync changes are persisted here.
  intel_file: "./configs/intel.yaml"
  reload_interval_sec: 30
  enable_hot_reload: true
  prune_expired_interval_sec: 300
  accept_stix: true
  default_source: "Threat Intel Hub"
  max_items: 100000
  # 每日定时从下述目录增量同步 IOC 规则到 intel_file(主文件即唯一规则来源)。
  ioc_sync_dir: "/data/yt/ioc"    # 网闸投递的规则 zip 目录；设 "" 关闭
  enable_ioc_sync: true
  ioc_sync_hour: 1                # 每天触发时刻（本地时，0-23）
  ioc_sync_daily_limit: 10        # 每天最多新增条数
  ioc_sync_retain_days: 10        # 删除该目录内早于 N 天的 zip

evidence:
  enable_pcap_save: true
  pcap_dir: "./data/evidence"

event:
  enable_push: true
  queue_db: "./data/event_queue.db"
  push_batch_size: 100
  retry_interval_sec: 30
  push_timeout_sec: 5
  # Sliding window (seconds) for the node-local burst counter stamped on events
  # as local_hit_count/local_window_sec (node-scoped hint, not a global count).
  # Set 0 to disable.
  local_hit_window_sec: 60

flow:
  max_flows: 1000000
  idle_timeout_sec: 120
  cleanup_interval_sec: 30

server:
  enable: true
  # Bind to localhost by default; the config page and write APIs are otherwise
  # exposed without auth. Set a token and/or front with a TLS reverse proxy
  # before binding to 0.0.0.0.
  listen: "127.0.0.1:19090"
  token: ""
