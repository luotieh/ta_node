node:
  device_id: "node-arm-offline-001"
  # For the warning-platform backend use the node ingest path, e.g.
  #   http://<host>:<port>/traffic/internal/event/push
  # (NOT /api/events* — that is the agent event-create API and 400s node events.)
  management_url: ""
  # Sent as X-API-Key on push; set only if the management sets internal_api_key.
  api_key: ""

capture:
  interface: "eth0"
  pcap_file: ""
  bpf_filter: ""
  snaplen: 1600
  promiscuous: true

patterns:
  # 指纹（payload 正则）检测开关。false 时不加载 pattern_dir，节点只推送
  # intel IOC 命中产生的事件。
  enable: false
  pattern_dir: "./patterns"

intel:
  intel_file: "./configs/intel.yaml"
  reload_interval_sec: 30
  enable_hot_reload: true
  prune_expired_interval_sec: 300
  accept_stix: true
  default_source: "Threat Intel Hub"
  max_items: 100000
  # 每日定时从下述目录增量同步 IOC 规则到 intel_file(主文件即唯一规则来源)。
  ioc_sync_dir: "/data/yt/ioc"    # 网闸投递的规则 zip 目录；设 "" 关闭
  enable_ioc_sync: true
  ioc_sync_hour: 1                # 每天触发时刻（本地时，0-23）
  ioc_sync_daily_limit: 10        # 每天最多新增条数
  ioc_sync_retain_days: 10        # 删除该目录内早于 N 天的 zip

evidence:
  enable_pcap_save: true
  pcap_dir: "./data/evidence"

event:
  enable_push: false
  queue_db: "./data/event_queue.db"
  push_batch_size: 100
  retry_interval_sec: 30
  push_timeout_sec: 5

server:
  enable: true
  listen: "127.0.0.1:19090"
  token: "CHANGE_ME_TO_A_RANDOM_TOKEN"
